spring.application.name=iBirdWatchingServer
server.port=8080

# 公开 demo 默认不使用外部云服务
app.demo-mode=${DEMO_MODE:true}
app.map.provider=${MAP_PROVIDER:mock}
app.ai.provider=${AI_PROVIDER:local}

# 默认使用 local profile（加载 application-local.properties，密钥仅存本地）；
# 生产环境用环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
spring.profiles.default=local

# ============ 数据库（环境变量优先，冒号后为默认值） ============
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ibird_watching?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============ JWT ============
jwt.secret=${JWT_SECRET:}
jwt.access-expire-seconds=7200
jwt.refresh-expire-seconds=604800

# ============ 云端 API 密钥（仅存在于服务端，永不提交代码库） ============
tianditu.tk=${TIAN_DITU_TK:}
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}

# ============ 存储 ============
app.upload-dir=${UPLOAD_DIR:./data/upload}
app.tile-cache-dir=${TILE_CACHE_DIR:./data/tiles}
app.model-dir=${MODEL_DIR:./models}
